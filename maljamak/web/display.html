<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자막</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; }
  body { display: flex; flex-direction: column; justify-content: flex-end; padding: 4vh 5vw; box-sizing: border-box;
         font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; cursor: none; }
  body.pointer { cursor: default; }
  #box { overflow: hidden; }
  #text { font-weight: 700; letter-spacing: -0.01em; word-break: keep-all; overflow-wrap: anywhere;
          text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6); }
  /* 지난 줄은 살짝 흐리게, 지금 말하는 줄은 가장 밝게 — 어디를 읽어야 할지 바로 보이게 */
  #text > div { color: #c9c9c9; transition: color 0.5s; }
  #text > div.current { color: #ffffff; }
  #text span.new { animation: appear 0.35s ease-out; }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }

  #hint { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px;
          background: rgba(255, 255, 255, 0.08); color: #9a9a9a; font: 14px system-ui, sans-serif; transition: opacity 0.6s; }
  #hint.hidden { opacity: 0; pointer-events: none; }
  /* 전체 화면 버튼: 마우스를 움직이면 안내와 함께 잠깐 나타난다 */
  #fs { position: fixed; top: 14px; right: 16px; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,.18);
        background: rgba(255,255,255,.08); color: #d0d0d0; font: 600 13px system-ui, sans-serif; cursor: pointer; transition: opacity .6s; }
  #fs:hover { background: rgba(255,255,255,.16); color: #fff; }
  #fs.hidden { opacity: 0; pointer-events: none; }
  #conn { position: fixed; right: 16px; bottom: 12px; font: 12px system-ui, sans-serif; color: #ff8787; opacity: 0; transition: opacity 0.4s; }
  #conn.show { opacity: 0.8; }
</style>
</head>
<body>
<div id="hint">이 창을 프로젝터 화면으로 옮긴 뒤 전체 화면을 누르세요 (더블클릭도 됩니다)</div>
<button id="fs" type="button">⛶ 전체 화면</button>
<div id="conn">● 연결 끊김 — 다시 연결하는 중</div>
<div id="box"><div id="text"></div></div>
<script>
// 조작자가 내보낸 조각만 이어서 보여준다. 고친 조각은 그 자리에서 조용히 바뀐다.
const text = document.getElementById("text");
const box = document.getElementById("box");
const hint = document.getElementById("hint");
let style = { font_size: 56, lines: 3 };
const shown = new Set();  // 이미 보여 준 조각 id — 새로 들어온 조각만 살짝 나타나게 한다

// 줄바꿈: 조작자가 Shift+Enter 로 표시한 조각 뒤, 조작자가 찍은 문장부호 뒤, (켜져 있으면) 자동 줄바꿈 지점.
// 한 문장이 길면 그 안에서만 화면 폭에 맞춰 넘어간다.
const SENTENCE_END = /[.?!。？！…]$/;

function render(items) {
  const lineHeight = 1.5;
  text.style.fontSize = `${style.font_size}px`;
  text.style.lineHeight = String(lineHeight);
  box.style.maxHeight = `${style.font_size * lineHeight * style.lines}px`;
  const lines = [];
  let prev = null;
  for (const item of items) {
    if (!lines.length || item.newline || (prev && (prev.break_after || SENTENCE_END.test(prev.text)))) lines.push([]);
    lines[lines.length - 1].push(item);
    prev = item;
  }
  text.replaceChildren(...lines.map((line, index) => {
    const div = document.createElement("div");
    if (index === lines.length - 1) div.className = "current";
    line.forEach((item, i) => {
      if (i) div.append(" ");
      const span = document.createElement("span");
      span.textContent = item.text;
      if (!shown.has(item.id)) { span.className = "new"; shown.add(item.id); }
      div.append(span);
    });
    return div;
  }));
  // 최신 줄이 보이도록 아래로 붙인다.
  box.scrollTop = box.scrollHeight;
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws?role=display`);
  ws.onopen = () => document.getElementById("conn").classList.remove("show");
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type !== "display") return;
    style = msg.style || style;
    render(msg.items);
  };
  ws.onclose = () => { document.getElementById("conn").classList.add("show"); setTimeout(connect, 1000); };
}

// 안내 문구와 전체 화면 버튼은 처음 몇 초만 보이고, 마우스를 움직이면 잠깐 다시 보인다.
// 전체 화면 중에는 안내는 숨기고 버튼만 "전체 화면 끝내기"로 보여 준다.
const fsBtn = document.getElementById("fs");
let hintTimer = null;
function showControls(ms) {
  const full = !!document.fullscreenElement;
  hint.classList.toggle("hidden", full);
  fsBtn.classList.remove("hidden");
  document.body.classList.add("pointer");
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => {
    hint.classList.add("hidden"); fsBtn.classList.add("hidden"); document.body.classList.remove("pointer");
  }, ms);
}
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}
fsBtn.onclick = (e) => { e.stopPropagation(); toggleFullscreen(); };
document.addEventListener("mousemove", () => showControls(2500));
document.addEventListener("dblclick", (e) => { if (e.target !== fsBtn) toggleFullscreen(); });
document.addEventListener("fullscreenchange", () => {
  fsBtn.textContent = document.fullscreenElement ? "전체 화면 끝내기" : "⛶ 전체 화면";
  hint.classList.add("hidden"); fsBtn.classList.add("hidden"); document.body.classList.remove("pointer");
});
showControls(6000);
connect();
</script>
</body>
</html>
