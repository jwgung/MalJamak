name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: node tests/chunker.test.mjs

      - name: Install
        run: pip install -r requirements.txt pyinstaller

      - name: Build
        run: |
          python packaging/make_icon.py
          pyinstaller --noconfirm packaging/VoiceKeyboard.spec

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = if ("${{ github.ref }}" -like "refs/tags/v*") { "${{ github.ref_name }}".Substring(1) } else { "0.0.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\installer.iss
          Get-ChildItem dist\VoiceKeyboard-Setup-*.exe | ForEach-Object { "SETUP=$($_.FullName)" >> $env:GITHUB_ENV }

      # 설치 파일을 조용히 설치하고, 설치된 exe 를 트레이 없이 띄워 숨긴 Chrome 엔진이 붙는지 확인한다.
      - name: Smoke test (installed)
        shell: pwsh
        run: |
          Start-Process $env:SETUP -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $exe = "$env:LOCALAPPDATA\Programs\VoiceKeyboard\VoiceKeyboard.exe"
          if (-not (Test-Path $exe)) { throw "설치된 exe 가 없습니다: $exe" }
          $p = Start-Process $exe -ArgumentList "--no-tray","--dry-run" -PassThru
          $status = $null
          for ($i = 0; $i -lt 90; $i++) {
            try { $status = (Invoke-RestMethod http://localhost:8765/api/settings).status; if ($status.engine) { break } } catch {}
            Start-Sleep 1
          }
          $status | ConvertTo-Json
          Stop-Process $p -Force
          Get-Content "$env:APPDATA\VoiceKeyboard\app.log" -ErrorAction SilentlyContinue
          if (-not $status.engine) { throw "엔진(Chrome)이 연결되지 않았습니다" }

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceKeyboard-Setup
          path: ${{ env.SETUP }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "${{ env.SETUP }}" --prerelease --title "${{ github.ref_name }}" --notes "Windows 설치 파일. VoiceKeyboard-Setup 을 실행해 설치하세요. Google Chrome 이 설치되어 있어야 합니다."
