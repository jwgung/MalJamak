name: ondevice-experiment

# Windows Chrome 에서 기기 내(오프라인) 음성 인식이 되는지 확인하는 실험. exp/** 브랜치에서만 돈다.
on:
  push:
    branches: ["exp/**"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp

      - name: Experiment
        run: |
          $dir = "$PWD\experiments\ondevice"
          $chrome = "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe"
          & $chrome --version 2>$null; (Get-Item $chrome).VersionInfo.ProductVersion
          Start-Process python -ArgumentList "-m","http.server","8799","--bind","127.0.0.1","--directory",$dir -WindowStyle Hidden
          $prof = "$env:RUNNER_TEMP\prof"

          function Start-Engine($extra) {
            Get-Process chrome -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep 2
            $args = @("--user-data-dir=$prof", "--window-position=-2400,-2400", "--no-first-run", "--remote-debugging-port=9333",
                      "--use-fake-ui-for-media-stream", "--use-fake-device-for-media-stream",
                      "--use-file-for-fake-audio-capture=$dir\ko.wav", "--enable-logging", "--v=0") + $extra + @("http://localhost:8799/")
            Start-Process $chrome -ArgumentList $args | Out-Null
            for ($i = 0; $i -lt 30; $i++) {
              try { if ((Invoke-RestMethod http://127.0.0.1:9333/json/list) | Where-Object { $_.url -like "*8799*" }) { break } } catch {}
              Start-Sleep 1
            }
            Start-Sleep 8
          }
          function Run($label, $wait, $file, $gesture = "1") {
            "===== $label"
            python "$dir\run.py" 9333 ko-KR $wait "$dir\$file" $gesture
          }

          Start-Engine @()
          Run "net: google reachable?" 0 netcheck.js
          Run "install" 0 install.js 0
          Run "available" 0 local_avail.js
          Run "LOCAL track (headful)" 25 local_track.js
          Start-Sleep 20
          Run "available (after wait)" 0 local_avail.js
          Run "LOCAL track (headful, retry)" 25 local_track.js
          Get-Process chrome -ErrorAction SilentlyContinue | Stop-Process -Force
          "===== chrome log (speech/soda)"
          Get-Content "$prof\chrome_debug.log" -ErrorAction SilentlyContinue | Select-String -Pattern "soda|speech|Speech|SODA|on_device|recogni" | Select-Object -Last 40
          exit 0
