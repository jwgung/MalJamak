<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기기 내 음성 인식 테스트</title>
<style>
  body { margin: 0; padding: 20px 16px; font: 15px/1.5 system-ui, sans-serif; max-width: 720px; }
  button { padding: 10px 14px; margin: 4px 4px 4px 0; font: inherit; border-radius: 8px; border: 1px solid #ccc; cursor: pointer; }
  #log { margin-top: 16px; padding: 12px; background: #111; color: #eee; border-radius: 8px; min-height: 240px;
         font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-all; }
  .hint { color: #666; font-size: 13px; }
</style>
</head>
<body>
<h1>기기 내(오프라인) 음성 인식 테스트</h1>
<p class="hint">일반 Google Chrome 에서 이 파일을 여세요. 순서대로 1 → 2 → 3, 4 를 눌러 보고, 3·4 는 버튼을 누른 뒤 한국어로 말하세요.
  인터넷을 끊고 3·4 를 다시 해 보면 진짜 오프라인인지 확인됩니다. 결과 화면을 그대로 복사해 주세요.</p>
<div>
  <button id="b1">1. 상태 확인</button>
  <button id="b2">2. 한국어 모델 설치</button>
  <button id="b3">3. 기기 내 인식 — 기본 마이크</button>
  <button id="b4">4. 기기 내 인식 — 마이크 트랙</button>
  <button id="b5">5. (비교) 클라우드 인식 — 기본 마이크</button>
  <button id="stop">정지</button>
</div>
<fieldset style="margin-top:12px; border:1px solid #ccc; border-radius:8px; padding:10px 12px">
  <legend>Groq 교정 (선택) — 앱과 같은 프롬프트</legend>
  <div><input id="key" type="password" placeholder="Groq API 키 (gsk_…)" style="width:60%; padding:8px" autocomplete="off">
    <select id="model" style="padding:8px">
      <option value="openai/gpt-oss-20b">GPT-OSS 20B (빠름)</option>
      <option value="openai/gpt-oss-120b">GPT-OSS 120B (품질)</option>
    </select></div>
  <div style="margin-top:8px">
    <label>교정 강도
      <select id="strength" style="padding:8px">
        <option value="aggressive">적극적 — 문맥상 어색한 단어를 발음이 비슷한 단어로 바꿈</option>
        <option value="conservative">보수적 — 띄어쓰기·명백한 오류만 (현재 앱)</option>
      </select></label>
  </div>
  <div style="margin-top:8px">
    <label>단어장 (쉼표나 줄바꿈으로 구분)<br>
      <textarea id="glossary" rows="2" style="width:95%; padding:8px">Groq, Chrome, GitHub, 교정, 링크</textarea></label>
  </div>
  <p class="hint">키를 넣으면 확정된 문장마다 교정 결과가 아래에 같이 나옵니다. 키는 이 페이지 메모리에만 있고 저장되지 않습니다.</p>
  <div><input id="manual" placeholder="직접 넣어 교정해 보기 (예: 달콤달콩 달려간다 시골 버스 양)" style="width:75%; padding:8px">
    <button id="b6">교정</button> <button id="b7">4가지 비교</button></div>
</fieldset>
<div id="log"></div>
<script>
const log = (s) => { document.getElementById("log").textContent += `[${new Date().toLocaleTimeString()}] ${s}\n`; };
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, stream = null;
const opts = { langs: ["ko-KR"], processLocally: true };

// 보수적: 앱(voicekb/groq.py)과 같은 교정 프롬프트
const CONSERVATIVE_PROMPT = `너는 음성 인식(STT) 결과 교정기다. 입력은 사용자가 말한 내용을 받아쓴 텍스트다.
- 띄어쓰기, 맞춤법, 잘못 들린 단어를 문맥에 맞게 고친다.
- 한글로 적힌 영어 기술 용어·고유명사는 원래 영어 표기로 바꾼다. (예: 리액트 → React, 깃허브 → GitHub)
- "음", "어", "그러니까" 같은 군말은 지운다.
- 의미를 바꾸거나 내용을 덧붙이지 않는다. 질문이어도 답하지 않는다.
- 교정된 텍스트만 출력한다.`;

const AGGRESSIVE_PROMPT = `너는 음성 인식(STT) 결과 교정기다. 입력은 사용자가 한국어로 말한 내용을 받아쓴 텍스트이며,
발음이 비슷한 다른 단어로 잘못 들린 부분이 자주 섞여 있다.
- 문맥상 어색한 단어는 발음이 비슷하면서 문맥에 맞는 단어로 바꾼다. (예: 앞뒤가 다운로드 이야기인데 "다시 봤습니다" → "다시 받습니다")
- 용어 사전의 단어와 발음이 비슷한 부분은 사전 표기로 바꾼다. (예: 사전에 Groq 이 있으면 "그룹", "크록", "크로키" → "Groq")
- 한글로 적힌 영어 기술 용어·고유명사는 원래 영어 표기로 바꾼다. (예: 리액트 → React, 깃허브 → GitHub)
- 띄어쓰기, 맞춤법, 문장부호를 고친다. "음", "어" 같은 군말은 지운다.
- 내용을 덧붙이거나 질문에 답하지 않는다. 어떻게 고쳐야 할지 확신이 없는 부분은 원문 그대로 둔다.
- 교정된 텍스트만 출력한다.`;

function glossary() {
  return document.getElementById("glossary").value.split(/[,\n]/).map((w) => w.trim()).filter(Boolean);
}

async function correct(text, tag, override = {}) {
  const key = document.getElementById("key").value.trim();
  if (!key) { if (override.model) log("Groq 키를 먼저 넣으세요"); return; }
  const model = override.model || document.getElementById("model").value;
  const strength = override.strength || document.getElementById("strength").value;
  let system = strength === "aggressive" ? AGGRESSIVE_PROMPT : CONSERVATIVE_PROMPT;
  const words = glossary();
  if (words.length) system += "\n\n용어 사전 (반드시 이 형태로 보존):\n" + words.join(", ");
  const label = `${model.includes("120b") ? "120B" : "20B"}·${strength === "aggressive" ? "적극" : "보수"}`;
  const body = { model, temperature: 0.2, messages: [{ role: "system", content: system }, { role: "user", content: text }] };
  if (model.startsWith("openai/gpt-oss")) body.reasoning_effort = "low";
  const t0 = performance.now();
  try {
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${key}` }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) { log(`[${tag}] Groq 오류 ${res.status}: ${data.error?.message || ""}`); return; }
    log(`[${tag}] → Groq ${label}: ${data.choices[0].message.content.trim()}  (${Math.round(performance.now() - t0)}ms)`);
  } catch (e) { log(`[${tag}] Groq 호출 실패: ${e.message}`); }
}

log(`Chrome: ${navigator.userAgent.match(/Chrome\/[\d.]+/)?.[0]} · 온라인: ${navigator.onLine} · 출처: ${location.protocol}`);
log(`SpeechRecognition: ${!!window.SpeechRecognition} · available(): ${typeof SR?.available} · install(): ${typeof SR?.install}`);

document.getElementById("b1").onclick = async () => {
  try { log(`available(ko-KR, 기기 내) = ${await SR.available(opts)}`); } catch (e) { log(`available 오류: ${e.name} ${e.message}`); }
};
document.getElementById("b2").onclick = async () => {
  log("install 시작…");
  try { log(`install = ${await SR.install(opts)}`); } catch (e) { log(`install 오류: ${e.name} ${e.message}`); }
  try { log(`available 다시 = ${await SR.available(opts)}`); } catch (_) {}
};

function start(local, useTrack) {
  stop();
  rec = new SR();
  rec.lang = "ko-KR"; rec.continuous = true; rec.interimResults = true;
  if (local) rec.processLocally = true;
  const tag = `${local ? "기기 내" : "클라우드"}/${useTrack ? "트랙" : "기본 마이크"}`;
  rec.onstart = () => log(`[${tag}] 시작 — 말해 보세요`);
  rec.onaudiostart = () => log(`[${tag}] 오디오 수신 시작`);
  rec.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) { log(`[${tag}] 확정: ${r[0].transcript}`); correct(r[0].transcript, tag); }
    }
  };
  rec.onerror = (e) => log(`[${tag}] 오류: ${e.error} ${e.message || ""}`);
  rec.onend = () => log(`[${tag}] 종료`);
  return rec;
}

document.getElementById("b3").onclick = () => start(true, false).start();
document.getElementById("b4").onclick = async () => {
  try {
    const r = start(true, true);  // start() 가 이전 스트림을 정리하므로 먼저 부르고 나서 마이크를 연다
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    r.start(stream.getAudioTracks()[0]);
  } catch (e) { log(`마이크/트랙 오류: ${e.name} ${e.message}`); }
};
document.getElementById("b5").onclick = () => start(false, false).start();

function stop() {
  if (rec) { rec.onend = null; try { rec.stop(); } catch (_) {} rec = null; }
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
}
document.getElementById("b6").onclick = () => {
  const text = document.getElementById("manual").value.trim();
  if (!text) return;
  log(`[직접] 입력: ${text}`);
  correct(text, "직접");
};
document.getElementById("b7").onclick = async () => {
  const text = document.getElementById("manual").value.trim();
  if (!text) return;
  log(`[비교] 입력: ${text}`);
  for (const model of ["openai/gpt-oss-20b", "openai/gpt-oss-120b"])
    for (const strength of ["conservative", "aggressive"]) await correct(text, "비교", { model, strength });
};
document.getElementById("stop").onclick = () => { stop(); log("정지"); };
</script>
</body>
</html>
