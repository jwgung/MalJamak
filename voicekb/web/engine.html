<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Voice Keyboard Engine</title>
</head>
<body>
<script>
// 숨긴(headless) Chrome 에서 도는 엔진. 화면은 없고 서버 명령만 받는다.
//   음성 입력: 마이크 트랙 → SpeechRecognition.start(track) → 확정 문장을 서버로 (서버가 붙여넣기)
//   자막: 서버가 보내는 시스템 소리 PCM → MediaStreamTrackGenerator 트랙 → 인식 → 문장 단위 번역 → 서버로

const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let ws = null;

function send(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }
function report(where, error) { send({ type: "error", where, error: String(error) }); }

// Chrome 은 침묵이나 시간 제한으로 세션을 끊으므로 켜져 있는 동안 다시 시작한다.
// 장치 없음 같은 오류가 반복되면 간격을 늘리다가(최대 8초) 연속 5번이면 멈춘다.
const MAX_ERRORS = 5;
const BENIGN_ERRORS = new Set(["no-speech", "aborted"]);

// 결과 없이 1초 안에 끝난 세션도 오류로 센다 (기기 내 인식이 곧바로 aborted 로 끝나며 쉬지 않고 도는 것을 막는다).
function makeRestarter(isActive, startFn, onGiveUp) {
  let errors = 0;
  let startedAt = 0;
  let gotResult = false;
  const begin = () => { startedAt = performance.now(); gotResult = false; startFn(); };
  return {
    begin,
    ok() { errors = 0; gotResult = true; },
    error(code) { if (!BENIGN_ERRORS.has(code)) errors++; },
    ended() {
      if (!isActive()) return;
      if (!gotResult && performance.now() - startedAt < 1000) errors++;
      if (errors >= MAX_ERRORS) { onGiveUp(); return; }
      const delay = errors ? Math.min(500 * 2 ** (errors - 1), 8000) : 0;
      setTimeout(() => { if (isActive()) { try { begin(); } catch (_) { /* 이미 시작됨 */ } } }, delay);
    },
  };
}

// 기기 내(오프라인) 인식 준비. Chrome 은 다시 켜면 설치 상태를 잊지만, 받아 둔 모델이 있으면 install() 이 곧바로 끝난다.
async function ensureLocal(lang) {
  if (typeof Recognition.available !== "function") throw new Error("이 Chrome 은 오프라인 인식을 지원하지 않습니다 (Chrome 139 이상 필요)");
  const opts = { langs: [lang], processLocally: true };
  const state = await Recognition.available(opts);
  if (state === "unavailable") throw new Error(`${lang} 오프라인 인식을 지원하지 않습니다`);
  if (state === "available") return;
  let ok;
  try { ok = await Recognition.install(opts); }
  catch (err) {
    // 일부 환경은 첫 다운로드에 사용자 클릭을 요구한다. 숨긴 엔진에서는 클릭할 수 없다.
    if (err.name === "NotAllowedError" || /gesture/i.test(err.message)) {
      throw new Error("이 PC 의 Chrome 은 오프라인 모델을 처음 받을 때 클릭이 필요해 자동 설치할 수 없습니다. 온라인 방식을 쓰세요.");
    }
    throw err;
  }
  if (!ok) throw new Error(`${lang} 오프라인 모델 설치에 실패했습니다`);
}

const LOCAL_GIVE_UP = "오프라인 인식이 계속 실패해 멈췄습니다. 설정에서 인식 방식을 온라인으로 바꿔 보세요.";

function newRecognition(lang) {
  const r = new Recognition();
  r.lang = lang;
  r.continuous = true;
  r.interimResults = true;
  return r;
}

// ───────────── 음성 입력 ─────────────

let input = null;   // { rec, stream }
let inputGen = 0;   // 모델 설치·마이크 열기를 기다리는 사이 정지/재시작되면 늦게 끝난 시작을 버린다

async function startInput(lang, mic, local) {
  stopInput();
  const gen = inputGen;
  if (local) {
    try { await ensureLocal(lang); }
    catch (err) { if (gen === inputGen) send({ type: "input_stopped", reason: err.message }); return; }
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: mic ? { deviceId: { exact: mic } } : true });
  } catch (err) {
    if (gen === inputGen) send({ type: "input_stopped", reason: `마이크를 열 수 없습니다: ${err.message}` });
    return;
  }
  if (gen !== inputGen) { stream.getTracks().forEach((t) => t.stop()); return; }
  const track = stream.getAudioTracks()[0];
  const r = newRecognition(lang);
  if (local) r.processLocally = true;
  const state = { rec: r, stream };
  input = state;
  const restarter = makeRestarter(() => input === state, () => r.start(track), () => {
    stopInput();
    send({ type: "input_stopped", reason: local ? LOCAL_GIVE_UP : "음성 인식 오류가 반복되어 멈췄습니다." });
  });
  r.onresult = (e) => {
    restarter.ok();
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) send({ type: "final", text: e.results[i][0].transcript });
    }
  };
  r.onerror = (e) => { restarter.error(e.error); if (!BENIGN_ERRORS.has(e.error)) report("input", e.error); };
  r.onend = () => restarter.ended();
  restarter.begin();
}

function stopInput() {
  inputGen++;
  const s = input;
  if (!s) return;
  input = null;
  s.rec.onend = null;
  try { s.rec.stop(); } catch (_) {}
  s.stream.getTracks().forEach((t) => t.stop());
}

// ───────────── 자막 ─────────────

const MAX_LINES = 2;
const FLUSH_SILENCE_MS = 1200;
const FLUSH_MAX_CHARS = 160;
const SENTENCE_END = /[.!?。！？]$/;

let cap = null;
let capGen = 0;
let lineSeq = 0;
let builtinState = "unknown";

async function createBuiltinTranslator(source, target = "ko") {
  if (!("Translator" in self)) throw new Error("내장 번역 API 없음");
  const opts = { sourceLanguage: source, targetLanguage: target };
  if ((await Translator.availability(opts)) === "unavailable") throw new Error(`${source}→${target} 미지원`);
  return Translator.create(opts);
}

function publish(c) {
  if (cap !== c) return;
  send({ type: "captions", lines: c.lines.map(({ id, src, ko }) => ({ id, src, ko })), live: c.live });
}

async function translateLive(c, text) {
  if (!text) return "";
  if (!c.translate) return text;  // 번역 없이 원문 그대로 (한국어 회의 등)
  if (c.builtin) return c.builtin.translate(text).catch(() => "");
  return "";  // Groq 는 확정 문장에만 쓴다
}

function bufferFinal(c, src) {
  c.buffer = c.buffer ? `${c.buffer} ${src}` : src;
  clearTimeout(c.flushTimer);
  if (SENTENCE_END.test(c.buffer) || c.buffer.length >= FLUSH_MAX_CHARS) flushSentence(c);
  else c.flushTimer = setTimeout(() => flushSentence(c), FLUSH_SILENCE_MS);
}

// 완성된 문장을 자막 줄로 확정한다. 내장 번역을 먼저 넣고, Groq 번역이 오면 교체한다.
async function flushSentence(c) {
  clearTimeout(c.flushTimer);
  const src = c.buffer.trim();
  c.buffer = "";
  if (!src || cap !== c) return;
  const line = { id: ++lineSeq, src, ko: c.translate ? "" : src };
  const context = c.lines.map((l) => l.src).slice(-2);
  c.lines.push(line);
  if (c.lines.length > MAX_LINES) c.lines.shift();
  c.live = null;
  if (c.useGroq) send({ type: "translate", id: line.id, text: src, source: c.lang, target: c.targetLang, context });
  if (c.builtin) {
    const ko = await c.builtin.translate(src).catch(() => "");
    if (!line.groq) line.ko = ko;
  }
  publish(c);
}

function applyGroqTranslation(id, ko) {
  const line = cap && cap.lines.find((l) => l.id === id);
  if (!line) return;
  line.ko = ko;
  line.groq = true;
  publish(cap);
}

async function startCaptions(lang, translator, groqAvailable, local, translate = true, targetLang = "ko-KR") {
  stopCaptions();
  const gen = capGen;
  if (local) {
    try { await ensureLocal(lang); }
    catch (err) { if (gen === capGen) send({ type: "captions_stopped", reason: err.message }); return; }
  }
  const source = lang.split("-")[0];
  let builtin = null;
  if (translate && (translator === "auto" || translator === "builtin")) {
    try { builtin = await createBuiltinTranslator(source, targetLang.split("-")[0]); }
    catch (err) { report("translator", err.message); }
  }
  const useGroq = translate && groqAvailable && (translator === "groq" || (translator === "auto" && !builtin));
  if (gen !== capGen) { builtin?.destroy?.(); return; }

  // 서버가 보내는 PCM 을 오디오 트랙으로 만든다.
  const generator = new MediaStreamTrackGenerator({ kind: "audio" });
  const writer = generator.writable.getWriter();
  const r = newRecognition(lang);
  if (local) r.processLocally = true;
  const c = { rec: r, generator, writer, builtin, useGroq, translate, lang, targetLang, lines: [], live: null,
              buffer: "", flushTimer: null, timestamp: 0, liveSeq: 0 };
  cap = c;

  const restarter = makeRestarter(() => cap === c, () => r.start(generator), () => {
    stopCaptions();
    send({ type: "captions_stopped", reason: local ? LOCAL_GIVE_UP : "자막 인식 오류가 반복되어 멈췄습니다." });
  });
  r.onresult = async (e) => {
    restarter.ok();
    let live = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) { const t = res[0].transcript.trim(); if (t) bufferFinal(c, t); }
      else live += res[0].transcript;
    }
    const pending = [c.buffer, live].filter(Boolean).join(" ").trim();
    const seq = ++c.liveSeq;
    const ko = await translateLive(c, pending);
    if (cap === c && seq === c.liveSeq) { c.live = pending ? { src: pending, ko } : null; publish(c); }
  };
  r.onerror = (e) => { restarter.error(e.error); if (!BENIGN_ERRORS.has(e.error)) report("captions", e.error); };
  r.onend = () => restarter.ended();
  restarter.begin();
  publish(c);
}

function pushAudio(buf) {
  const c = cap;
  if (!c || buf.byteLength < 8) return;
  // 서버 pack_audio: 샘플레이트(u32le) + 채널 수(u16le) + 0(u16) + s16le 인터리브 PCM
  const head = new DataView(buf, 0, 8);
  const sampleRate = head.getUint32(0, true), channels = head.getUint16(4, true);
  const frames = (buf.byteLength - 8) / 2 / channels;
  if (sampleRate < 8000 || sampleRate > 192000 || !channels || channels > 8 || !Number.isInteger(frames) || !frames) return;
  try {
    const data = new AudioData({ format: "s16", sampleRate, numberOfFrames: frames,
                                 numberOfChannels: channels, timestamp: c.timestamp, data: new Uint8Array(buf, 8) });
    c.timestamp += Math.round((frames / sampleRate) * 1e6);
    c.writer.write(data).catch((err) => report("audio", err.message));
  } catch (err) { report("audio", err.message); }
}

function stopCaptions() {
  capGen++;
  const c = cap;
  if (!c) return;
  cap = null;
  clearTimeout(c.flushTimer);
  c.rec.onend = null;
  try { c.rec.stop(); } catch (_) {}
  c.writer.close().catch(() => {});
  c.generator.stop();
  c.builtin?.destroy?.();
}

// ───────────── 현장 자막: 마이크 → 조각(초안) ─────────────
// 문장 끝을 기다리면 늦고, 일정 간격으로 자르면 말 중간에서 끊긴다("올라갈 / 때").
// 그래서 자연스러운 지점에서 자른다: 문장 확정 → 말이 잠깐 멈춤 → 의미 단위가 끝나는 어미 → 그래도 오래 쌓이면 강제.
// Chrome 은 중간 결과를 계속 고치므로(예: "로마서 활성화" → "로마서 8장") 아직 흔들리는 끝부분은 남겨 둔다.

const MIN_CHUNK_WORDS = 3;
const MIN_GAP_MS = 1000;  // 어미 기준으로 너무 잘게 쪼개지지 않게
// 의미 단위가 끝나는 어미·문장부호. 이 단어 뒤에서 자르면 자연스럽다.
const BOUNDARY = /(니다|어요|아요|에요|예요|세요|해요|죠|다|요|까|고|며|서|는데|은데|인데|지만|니까|면|거든|[.,!?。！？])$/;
let live = null;
let liveGen = 0;

// 어디까지 내보냈는지는 단어 개수가 아니라 글자 수(공백 제외)로 기억한다.
// Chrome 은 확정할 때 단어를 합치거나 나눈다("올려 주세요" → "올려주세요"). 단어 개수로 세면 "주세요"가 두 번 나간다.
function resetLiveSession(L) {
  L.words = []; L.since = []; L.finalCount = 0; L.emitted = 0; L.preview = "";
  L.emittedChars = 0; L.partial = 0;  // partial: words[emitted] 중 이미 내보낸 앞 글자 수
}

function realignLive(L) {
  let acc = 0, k = 0;
  while (k < L.words.length && acc + L.words[k].length <= L.emittedChars) acc += L.words[k++].length;
  L.emitted = k;
  L.partial = k < L.words.length ? L.emittedChars - acc : 0;
}

function pendingWords(L, upto) {
  const parts = L.words.slice(L.emitted, upto);
  if (L.partial && parts.length) parts[0] = parts[0].slice(L.partial);
  return parts.filter(Boolean);
}

// reason: 조각이 잘린 이유. 서버가 문장 경계를 판단할 때 쓴다 (final > pause > boundary > max).
function emitLive(L, upto, reason = "max") {
  if (upto <= L.emitted) return;
  const parts = pendingWords(L, upto);
  L.emitted = upto;
  L.partial = 0;
  L.emittedChars += parts.join("").length;
  if (!parts.length) return;
  L.lastEmit = performance.now();
  send({ type: "draft", text: parts.join(" "), reason });
}

function sendLivePreview(L) {
  const preview = pendingWords(L, L.words.length).join(" ");
  if (preview !== L.preview) { L.preview = preview; send({ type: "live_preview", text: preview }); }
}

function onLiveResult(L, e) {
  const finals = [], interims = [];
  for (let i = 0; i < e.results.length; i++) {
    const words = e.results[i][0].transcript.trim().split(/\s+/).filter(Boolean);
    (e.results[i].isFinal ? finals : interims).push(...words);
  }
  const words = finals.concat(interims);
  const now = performance.now();
  let d = 0;
  while (d < words.length && d < L.words.length && words[d] === L.words[d]) d++;
  const changed = d < words.length || words.length !== L.words.length;
  L.since = L.since.slice(0, d).concat(words.slice(d).map(() => now));
  L.words = words;
  L.finalCount = finals.length;
  realignLive(L);
  if (changed) L.lastChange = now;
  evaluateLive(L);
}

// stable 까지의 단어 중, 최소 길이를 넘는 마지막 어미 지점을 찾는다. 없으면 -1.
// 어미 규칙은 한국어 전용이다. 다른 언어는 문장 확정·말 멈춤·최대 대기로만 자른다 (줄바꿈은 조작자가 Shift+Enter).
function lastBoundary(L, stable) {
  if (L.korean === false) return -1;
  for (let j = stable; j >= L.emitted + MIN_CHUNK_WORDS; j--) if (BOUNDARY.test(L.words[j - 1])) return j;
  return -1;
}

function evaluateLive(L) {
  const now = performance.now();
  let stable = L.emitted;
  while (stable < L.words.length && (stable < L.finalCount || now - L.since[stable] >= L.stableMs)) stable++;
  const pending = L.words.length - L.emitted;
  if (pending > 0) {
    const sinceEmit = now - L.lastEmit;
    const cut = lastBoundary(L, stable);
    if (L.finalCount === L.words.length && stable === L.words.length) emitLive(L, stable, "final");  // 1. 문장 확정
    else if (now - L.lastChange >= L.pauseMs) emitLive(L, L.words.length, "pause");  // 2. 말이 멈춤: 바뀌는 게 없으니 전부
    else if (cut > 0 && sinceEmit >= MIN_GAP_MS) emitLive(L, cut, "boundary");  // 3. 의미 단위가 끝나는 어미
    else if (sinceEmit >= L.maxMs && stable > L.emitted) emitLive(L, cut > 0 ? cut : stable, "max");  // 4. 너무 오래 쌓임
  }
  sendLivePreview(L);
}

async function startLive(msg) {
  stopLive();
  const gen = liveGen;
  if (msg.local) {
    try { await ensureLocal(msg.lang); }
    catch (err) { if (gen === liveGen) send({ type: "live_stopped", reason: err.message }); return; }
  }
  let stream, testAudio = null;
  try {
    if (msg.test_audio) [stream, testAudio] = await openTestAudio(msg.test_audio, msg.offset || 0);
    else {
      // 믹서 직결 소리에는 통화용 보정(잡음 제거·자동 음량)이 오히려 방해가 된다.
      const audio = { echoCancellation: msg.processing, noiseSuppression: msg.processing, autoGainControl: msg.processing };
      if (msg.mic) audio.deviceId = { exact: msg.mic };
      stream = await navigator.mediaDevices.getUserMedia({ audio });
    }
  } catch (err) {
    if (gen === liveGen) send({ type: "live_stopped", reason: msg.test_audio ? `테스트 소리를 재생할 수 없습니다: ${err.message}`
                                                                            : `마이크를 열 수 없습니다: ${err.message}` });
    return;
  }
  if (gen !== liveGen) { stream.getTracks().forEach((t) => t.stop()); testAudio?.pause(); return; }
  if (msg.mode === "interpret") { await startInterpret(msg, stream, testAudio); return; }
  if (msg.mode === "dual") { await startDual(msg, stream, testAudio); return; }
  const track = stream.getAudioTracks()[0];
  const r = newRecognition(msg.lang);
  if (msg.local) r.processLocally = true;
  const L = { rec: r, stream, testAudio, korean: String(msg.lang || "").startsWith("ko"), maxMs: msg.max_ms || 4000, pauseMs: msg.pause_ms || 700, stableMs: msg.stable_ms || 800,
              lastEmit: performance.now(), lastChange: performance.now() };
  resetLiveSession(L);
  live = L;
  const restarter = makeRestarter(() => live === L, () => r.start(track), () => {
    stopLive();
    send({ type: "live_stopped", reason: msg.local ? LOCAL_GIVE_UP : "자막 인식 오류가 반복되어 멈췄습니다." });
  });
  r.onresult = (e) => { restarter.ok(); onLiveResult(L, e); };
  r.onerror = (e) => { restarter.error(e.error); if (!BENIGN_ERRORS.has(e.error)) report("live", e.error); };
  // 세션이 끊기면(침묵·네트워크 오류) 아직 확정 안 된 말까지 조각으로 넘겨 유실을 막는다.
  r.onend = () => { emitLive(L, L.words.length, "pause"); resetLiveSession(L); sendLivePreview(L); restarter.ended(); };
  L.timer = setInterval(() => evaluateLive(L), 200);
  if (testAudio) testAudio.onended = () => {
    if (live !== L) return;
    emitLive(L, L.words.length, "pause");
    stopLive();
    send({ type: "live_stopped", reason: "테스트 소리가 끝났습니다." });
  };
  restarter.begin();
}

// 테스트 소리: 서버가 받아 둔 영상 소리를 재생하고 그 소리를 오디오 트랙으로 뽑는다.
async function openTestAudio(url, offset) {
  const el = new Audio(url);
  el.preload = "auto";
  await new Promise((resolve, reject) => {
    el.onloadedmetadata = resolve;
    el.onerror = () => reject(new Error(el.error?.message || "파일을 열 수 없음"));
  });
  el.currentTime = offset;
  await el.play();
  const stream = el.captureStream();
  if (!stream.getAudioTracks().length) {
    await new Promise((resolve) => stream.addEventListener("addtrack", resolve, { once: true }));
  }
  return [stream, el];
}

function stopLive() {
  liveGen++;
  stopInterpret();
  stopDual();
  const L = live;
  if (!L) return;
  live = null;
  clearInterval(L.timer);
  L.rec.onend = null;
  try { L.rec.stop(); } catch (_) {}
  L.stream.getTracks().forEach((t) => t.stop());
  if (L.testAudio) { L.testAudio.onended = null; L.testAudio.pause(); L.testAudio.removeAttribute("src"); L.testAudio.load(); }
}

// ───────────── 순차통역 모드 ─────────────
// 강사(원어)와 통역사(통역 언어)가 번갈아 말하는 현장에서 통역 언어만 받는다. (실험: 순차통역 설교 2분, 유튜브 자막 대비 77~79%)
// - 한 인식 세션에 두 언어가 섞이면 한국어 인식기가 멈추므로, 쉼마다 세션을 새로 연다.
// - 인식기에는 소리를 delay 만큼 늦게 넣고 쉼 감지는 원래 소리로 해서, 쉼이 인식기에 닿기 전에 새 세션을 준비한다.
// - 연속 세션(이전 것은 겹쳐 돌린 뒤 정지) + 단발 세션(구글이 말 끝을 판단)을 함께 돌려 서로 빈 곳을 메운다.
// - 결과는 영어 단어를 빼고, 비슷한 중복·앞부분 반복을 합쳐 새로 늘어난 말만 조각으로 보낸다.

// ── 순차통역 합치기 시작
// 통역 언어의 문자 체계. 결과에서 다른 문자로 된 단어(강사 원어가 섞여 든 것)를 빼고, 같은 글자 기준으로 중복을 비교한다.
// 강사와 통역이 같은 문자를 쓰면(예: 영어 강사 → 스페인어 통역) 문자로는 못 가르므로 인식기가 다른 언어를 무시하는 데 맡긴다.
const SCRIPT_CLASS = {
  ko: "\\p{Script=Hangul}",
  ja: "\\p{Script=Hiragana}\\p{Script=Katakana}\\p{Script=Han}ー",
  zh: "\\p{Script=Han}",
  ru: "\\p{Script=Cyrillic}", uk: "\\p{Script=Cyrillic}", mn: "\\p{Script=Cyrillic}",
  th: "\\p{Script=Thai}", hi: "\\p{Script=Devanagari}", ne: "\\p{Script=Devanagari}", ar: "\\p{Script=Arabic}",
};
function scriptClass(lang) { return SCRIPT_CLASS[String(lang || "ko").split("-")[0].toLowerCase()] || "\\p{Script=Latin}"; }
function makeNorm(lang) {
  const keep = new RegExp(`[^${scriptClass(lang)}0-9]`, "gu");
  return (s) => s.replace(keep, "").toLowerCase();
}
// 단어에 통역 언어 문자·숫자·기호가 아닌 글자가 있으면 다른 언어 단어로 본다
function makeForeign(lang) {
  const other = new RegExp(`[^${scriptClass(lang)}0-9\\s\\p{P}\\p{S}\\p{M}]`, "u");
  const own = new RegExp(`[${scriptClass(lang)}0-9]`, "u");
  return (w) => other.test(w) || !own.test(w);
}
const normKo = makeNorm("ko");

// 두 문자열의 공통 구간 목록 (difflib.get_matching_blocks 와 같은 방식, 짧은 문자열용)
function matchingBlocks(a, b) {
  const out = [];
  const stack = [[0, a.length, 0, b.length]];
  while (stack.length) {
    const [alo, ahi, blo, bhi] = stack.pop();
    let best = [alo, blo, 0];
    let prev = new Map();
    for (let i = alo; i < ahi; i++) {
      const cur = new Map();
      for (let j = blo; j < bhi; j++) {
        if (a[i] !== b[j]) continue;
        const k = (prev.get(j - 1) || 0) + 1;
        cur.set(j, k);
        if (k > best[2]) best = [i - k + 1, j - k + 1, k];
      }
      prev = cur;
    }
    const [i, j, k] = best;
    if (!k) continue;
    out.push(best);
    if (alo < i && blo < j) stack.push([alo, i, blo, j]);
    if (i + k < ahi && j + k < bhi) stack.push([i + k, ahi, j + k, bhi]);
  }
  return out.sort((x, y) => x[0] - y[0] || x[1] - y[1]);
}

// 단어 목록에서 앞쪽 n 글자(공백·기호 제외)에 해당하는 단어 수. exact 면 정확히 n 에서 끝날 때만.
function wordsCovering(words, n, exact, norm = normKo) {
  let acc = 0;
  for (let i = 0; i < words.length; i++) {
    if (acc >= n) return exact && acc !== n ? -1 : i;
    acc += norm(words[i]).length;
  }
  return exact && acc !== n ? -1 : words.length;
}

// 겹쳐 도는 세션들의 결과를 이어 붙인다. add() 는 새로 늘어난 단어만 돌려준다.
class InterpretMerger {
  constructor(lang = "ko-KR", window = 160, similar = 0.6) {
    this.words = []; this.window = window; this.similar = similar;
    this.norm = makeNorm(lang); this.foreign = makeForeign(lang);
  }
  add(text) {
    const norm = this.norm;
    let words = text.split(/\s+/).filter((w) => w && !this.foreign(w));
    let nw = norm(words.join(""));
    if (nw.length < 2) return [];
    const tail = norm(this.words.join("")).slice(-this.window);
    // 최근 글의 끝과 새 결과의 앞이 그대로 겹치면("…바로" + "바로 노래라는…") 겹친 앞부분을 뗀다
    let L = 0;
    for (let k = Math.min(tail.length, nw.length); k > 1; k--) if (tail.endsWith(nw.slice(0, k))) { L = k; break; }
    if (L) {
      const cut = wordsCovering(words, L, true, norm);
      if (cut >= 0) { words = words.slice(cut); nw = norm(words.join("")); if (nw.length < 2) return []; }
    }
    // 같은 말을 조금 다르게 받아 적은 중복("불평/불편")이면 겹치지 않는 뒷부분만 붙인다.
    // "그리고 그 백성은 동일한 백성이었습니다" 와 "그 백성은 사실 저였습니다" 처럼 공통 글자("그 백성은", "~습니다")가
    // 흩어져 있을 뿐인 다른 문장은 중복이 아니다. 그래서 공통 구간이 걸친 최근 글의 구간과 새 결과가 전체적으로 닮아야 한다.
    const blocks = matchingBlocks(tail, nw).filter((b) => b[2] >= 2);
    const matched = blocks.reduce((sum, b) => sum + b[2], 0);
    const region = blocks.length ? blocks[blocks.length - 1][0] + blocks[blocks.length - 1][2] - blocks[0][0] : 0;
    const alike = blocks.length ? (2 * matched) / (region + nw.length) : 0;  // 0~1, difflib ratio 와 같은 식
    if (blocks.length && matched / nw.length >= this.similar && alike >= 0.75) {
      const [ai, bj, k] = blocks[blocks.length - 1];
      if (ai + k >= tail.length - 3 && nw.length - (bj + k) >= 3) {
        const added = words.slice(wordsCovering(words, bj + k, false, norm));
        this.words.push(...added);
        return added;
      }
      return [];
    }
    this.words.push(...words);
    return words;
  }
}
// ── 순차통역 합치기 끝

let interp = null;

async function startInterpret(msg, stream, testAudio) {
  const target = msg.lang || "ko-KR", other = msg.other_lang || "en-US";
  // 일반 모드의 조각 나누기 값(pause_ms=0.7초)과 섞이지 않게 순차통역 전용 값을 쓴다.
  // 강사↔통역사 바통 넘김의 쉼은 0.3~1.0초였다 (실험 영상 분석).
  const pauseMs = msg.interp_pause_ms || 300, threshold = msg.interp_threshold || 0.02;
  const delaySec = (msg.interp_delay_ms || 600) / 1000, overlapMs = msg.interp_overlap_ms || 1200;
  const ctx = new AudioContext();
  const src = ctx.createMediaStreamSource(stream);
  const analyser = ctx.createAnalyser(); analyser.fftSize = 1024; src.connect(analyser);
  const delay = ctx.createDelay(2); delay.delayTime.value = delaySec;
  const dest = ctx.createMediaStreamDestination(); src.connect(delay).connect(dest);
  const delayed = dest.stream.getAudioTracks()[0];
  const buf = new Float32Array(analyser.fftSize);
  const I = { ctx, stream, testAudio, merger: new InterpretMerger(target), sessions: new Set(), timers: [], otherAt: 0, stopped: false };
  interp = I;
  const session = (lang, continuous, onText, lifeMs) => {
    if (I.stopped) return null;
    debug("open", lang, continuous ? "연속" : "단발", "열린 세션", I.sessions.size + 1);
    const r = newRecognition(lang);
    r.continuous = continuous;
    r.interimResults = false;
    const tr = delayed.clone();
    I.sessions.add(r);
    r.onresult = (e) => { for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) onText(e.results[i][0].transcript.trim(), e.results[i][0].confidence); };
    r.onerror = (e) => { if (!BENIGN_ERRORS.has(e.error)) report("interpret", e.error); };
    r.onend = () => { tr.stop(); I.sessions.delete(r); };
    try { r.start(tr); } catch (err) { report("interpret", err.message); }
    if (lifeMs) I.timers.push(setTimeout(() => { try { r.stop(); } catch (_) {} }, lifeMs));
    return r;
  };
  const debug = (...a) => { if (window.VK_DEBUG) console.log("INTERP", ...a); };  // 진단용: CDP 로 window.VK_DEBUG = true
  const onTarget = (text) => {
    if (I.stopped) return;
    debug("target", text);
    // 원어를 한글로 받아 적은 짧은 결과("씽킹")는 같은 시각에 원어가 인식됐으면 버린다
    if (I.merger.norm(text).length <= 6 && performance.now() - I.otherAt < 2500) { debug("drop-short", text); return; }
    const added = I.merger.add(text);
    if (added.length) send({ type: "draft", text: added.join(" "), reason: "final" });
  };
  const onOther = (text, confidence = 1) => {
    if (I.stopped || !text) return;
    debug("other", confidence.toFixed(2), text.slice(0, 40));
    // 원어 인식기는 한국어 구간에서도 엉뚱한 영어를 낸다. 신뢰도가 낮은 것은 참고 줄에서 뺀다
    // (실측: 실제 영어 0.93~0.97, 엉터리 0.71~0.89 — 높은 엉터리도 있어 완전히 거를 수는 없다)
    if (confidence < 0.8) return;
    I.otherAt = performance.now();
    send({ type: "live_other", text });
  };
  let A = session(target, true, onTarget, 0);
  let O = session(other, true, onOther, 0);
  session(target, false, onTarget, 10000);
  const cut = () => {
    if (I.stopped) return;
    const oldA = A, oldO = O;
    A = session(target, true, onTarget, 0);
    O = session(other, true, onOther, 0);
    session(target, false, onTarget, 10000);
    I.timers.push(setTimeout(() => { for (const r of [oldA, oldO]) try { r?.stop(); } catch (_) {} }, overlapMs));
  };
  let speaking = false, silentSince = 0, dbgMin = 1, dbgMax = 0, dbgAt = performance.now(), dbgTicks = 0;
  I.timers.push(setInterval(() => {
    analyser.getFloatTimeDomainData(buf);
    let sum = 0; for (const v of buf) sum += v * v;
    const rms = Math.sqrt(sum / buf.length), now = performance.now();
    if (window.VK_DEBUG) {
      dbgMin = Math.min(dbgMin, rms); dbgMax = Math.max(dbgMax, rms); dbgTicks++;
      if (now - dbgAt > 2000) { debug("rms", dbgMin.toFixed(4), dbgMax.toFixed(4), "ticks", dbgTicks, "ctx", ctx.state, ctx.sampleRate); dbgMin = 1; dbgMax = 0; dbgTicks = 0; dbgAt = now; }
    }
    if (rms > threshold) { speaking = true; silentSince = 0; }
    else if (speaking) {
      if (!silentSince) silentSince = now;
      else if (now - silentSince >= pauseMs) {
        speaking = false;
        // 쉼이 시작된 지점이 늦춘 소리로 인식기에 닿는 순간 새 세션을 연다
        I.timers.push(setTimeout(cut, Math.max(0, delaySec * 1000 - pauseMs + 50)));
      }
    }
  }, 30));
  if (testAudio) testAudio.onended = () => {
    if (interp !== I) return;
    stopInterpret();
    send({ type: "live_stopped", reason: "테스트 소리가 끝났습니다." });
  };
}

function stopInterpret() {
  const I = interp;
  if (!I) return;
  interp = null;
  I.stopped = true;
  for (const t of I.timers) { clearTimeout(t); clearInterval(t); }
  for (const r of I.sessions) { r.onend = null; try { r.abort(); } catch (_) {} }
  I.stream.getTracks().forEach((t) => t.stop());
  I.ctx.close().catch(() => {});
  if (I.testAudio) { I.testAudio.onended = null; I.testAudio.pause(); I.testAudio.removeAttribute("src"); I.testAudio.load(); }
}

// ───────────── 이중 STT 모드 ─────────────
// 영어 STT + Chrome 내장 번역, 한글 STT 를 병렬로 돌리고 각기 자막 조각을 만든다.
// 조작자가 둘을 나란히 보고 고른 쪽만 자막 화면에 낸다.
// InterpretMerger 는 쓰지 않는다 — 각 언어가 자기 속도로 조각을 만들고 서로 독립적이다.
// Chrome 인식기는 다른 언어에 무응답이라, 강사(영어) 구간은 영어만·통역(한글) 구간은 한글만 자연스럽게 잡힌다.

let dual = null;
let dualGen = 0;

async function startDual(msg, stream, testAudio) {
  stopDual();
  const gen = dualGen;
  const target = msg.lang || "ko-KR";   // 통역(한국어)
  const other = msg.other_lang || "en-US"; // 강사(영어)

  // Chrome 내장 번역기 (영어 → 한국어). 없으면 원문 그대로.
  let builtin = null;
  try { builtin = await createBuiltinTranslator(other.split("-")[0], target.split("-")[0]); }
  catch (err) { report("dual-translator", err.message); }
  if (gen !== dualGen) { builtin?.destroy?.(); return; }

  const mkSide = (lang, side, pairSide) => {
    const korean = String(lang).startsWith("ko");
    const track = stream.getAudioTracks()[0];
    const r = newRecognition(lang);
    if (msg.local) r.processLocally = true;
    const L = { rec: r, stream, testAudio, korean, side, pairSide,
                maxMs: msg.max_ms || 4000, pauseMs: msg.pause_ms || 700, stableMs: msg.stable_ms || 800,
                lastEmit: performance.now(), lastChange: performance.now() };
    resetLiveSession(L);
    const restarter = makeRestarter(() => dual !== null && (dual.Lko === L || dual.Len === L), () => r.start(track), () => {
      stopDual();
      send({ type: "live_stopped", reason: msg.local ? LOCAL_GIVE_UP : "자막 인식 오류가 반복되어 멈췄습니다." });
    });
    r.onresult = (e) => { restarter.ok(); onDualResult(L, e); };
    r.onerror = (e) => { restarter.error(e.error); if (!BENIGN_ERRORS.has(e.error)) report("dual", e.error); };
    r.onend = () => { emitDual(L, L.words.length, "pause"); resetLiveSession(L); sendLivePreview(L); restarter.ended(); };
    L.timer = setInterval(() => evaluateDual(L), 200);
    restarter.begin();
    return L;
  };

  const Lko = mkSide(target, "interpret", "interpret");
  const Len = mkSide(other, "translate", "translate");

  dual = { Lko, Len, stream, testAudio, builtin, stopped: false, pairSeq: 0, lastEnPair: 0, lastEnAt: 0, lastKoPair: 0 };

  if (testAudio) testAudio.onended = () => {
    if (dual && dual.stopped) return;
    stopDual();
    send({ type: "live_stopped", reason: "테스트 소리가 끝났습니다." });
  };
}

function onDualResult(L, e) {
  const finals = [], interims = [];
  for (let i = 0; i < e.results.length; i++) {
    const words = e.results[i][0].transcript.trim().split(/\s+/).filter(Boolean);
    (e.results[i].isFinal ? finals : interims).push(...words);
  }
  const words = finals.concat(interims);
  const now = performance.now();
  let d = 0;
  while (d < words.length && d < L.words.length && words[d] === L.words[d]) d++;
  const changed = d < words.length || words.length !== L.words.length;
  L.since = L.since.slice(0, d).concat(words.slice(d).map(() => now));
  L.words = words;
  L.finalCount = finals.length;
  realignLive(L);
  if (changed) L.lastChange = now;
  evaluateDual(L);
}

// 각 언어가 자기 규칙으로 조각을 자른다.
// 한국어: 어미(BOUNDARY) + 문장 확정 + 말 멈춤 + 최대 대기
// 영어: 문장부호 + 말 멈춤 + 최대 대기 (어미 규칙 없음)
function evaluateDual(L) {
  const now = performance.now();
  let stable = L.emitted;
  while (stable < L.words.length && (stable < L.finalCount || now - L.since[stable] >= L.stableMs)) stable++;
  const pending = L.words.length - L.emitted;
  if (pending > 0) {
    const sinceEmit = now - L.lastEmit;
    const cut = L.korean ? lastBoundary(L, stable) : -1;
    if (L.finalCount === L.words.length && stable === L.words.length) emitDual(L, stable, "final");
    else if (now - L.lastChange >= L.pauseMs) emitDual(L, L.words.length, "pause");
    else if (cut > 0 && sinceEmit >= MIN_GAP_MS) emitDual(L, cut, "boundary");
    else if (sinceEmit >= L.maxMs && stable > L.emitted) emitDual(L, cut > 0 ? cut : stable, "max");
  }
  sendLivePreview(L);
}

async function emitDual(L, upto, reason) {
  if (upto <= L.emitted) return;
  const parts = pendingWords(L, upto);
  L.emitted = upto;
  L.partial = 0;
  L.emittedChars += parts.join("").length;
  if (!parts.length) return;
  L.lastEmit = performance.now();
  const text = parts.join(" ");
  const D = dual;
  if (!D || D.stopped) return;

  if (L.side === "translate") {
    // 영어 STT → Chrome 내장 번역 → 한국어 자막 조각
    D.pairSeq++;
    D.lastEnPair = D.pairSeq;
    D.lastEnAt = performance.now();
    let ko = text;
    if (D.builtin) {
      try { ko = await D.builtin.translate(text); } catch (_) {}
      if (!ko) ko = text;
    }
    if (!D.stopped) send({ type: "draft", text: ko, reason, side: "translate", pair_id: D.lastEnPair, source: text });
    // source(영어 원어)는 server.py 에서 다루지 않으므로 live.py Chunk.source 에 보관
    // (조작자 화면에서 원어를 참고로 보여 줄 수 있음)
  } else {
    // 한글 STT → 통역 자막 조각
    // 최근 영어 조각이 있으면 같은 pair_id 로 짝짓는다 (2초 내)
    const pair = (performance.now() - D.lastEnAt < 2000) ? D.lastEnPair : ++D.pairSeq;
    D.lastKoPair = pair;
    send({ type: "draft", text, reason, side: "interpret", pair_id: pair });
  }
}

function stopDual() {
  dualGen++;
  const D = dual;
  if (!D) return;
  dual = null;
  D.stopped = true;
  for (const L of [D.Lko, D.Len]) {
    clearInterval(L.timer);
    L.rec.onend = null;
    try { L.rec.abort(); } catch (_) {}
  }
  D.builtin?.destroy?.();
  D.stream.getTracks().forEach((t) => t.stop());
  if (D.testAudio) { D.testAudio.onended = null; D.testAudio.pause(); D.testAudio.removeAttribute("src"); D.testAudio.load(); }
}

// ───────────── 서버 연결 ─────────────

async function listMics() {
  try {
    // 권한을 받아야 장치 이름이 보인다 (엔진은 권한이 자동 허용됨).
    if (!input) (await navigator.mediaDevices.getUserMedia({ audio: true })).getTracks().forEach((t) => t.stop());
    const devices = await navigator.mediaDevices.enumerateDevices();
    return devices.filter((d) => d.kind === "audioinput").map((d) => ({ id: d.deviceId, label: d.label }));
  } catch (err) {
    report("mics", err.message);
    return [];
  }
}

// 내장 번역 API 는 Chrome 시작 후 몇 초 뒤에 생길 수 있어 잠시 기다리며 확인한다.
async function probeBuiltinTranslator() {
  for (let i = 0; i < 15 && !("Translator" in self); i++) await new Promise((r) => setTimeout(r, 1000));
  if (!("Translator" in self)) builtinState = "unsupported";
  else {
    try { builtinState = await Translator.availability({ sourceLanguage: "en", targetLanguage: "ko" }); }
    catch (err) { builtinState = `error: ${err.message}`; }
  }
  send({ type: "engine_info", builtin_translator: builtinState, local_speech: localSpeechState() });
}

function localSpeechState() {
  return Recognition && typeof Recognition.available === "function" ? "supported" : "unsupported";
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws?role=engine`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => send({ type: "engine_info", builtin_translator: builtinState, local_speech: localSpeechState() });
  ws.onclose = () => { stopInput(); stopCaptions(); stopLive(); setTimeout(connect, 1000); };
  ws.onmessage = async (e) => {
    if (e.data instanceof ArrayBuffer) { pushAudio(e.data); return; }
    const msg = JSON.parse(e.data);
    switch (msg.cmd || msg.type) {
      case "input_start": startInput(msg.lang, msg.mic, msg.local); break;
      case "input_stop": stopInput(); break;
      case "captions_start": startCaptions(msg.lang, msg.translator, msg.groq, msg.local, msg.translate, msg.target_lang || "ko-KR"); break;
      case "captions_stop": stopCaptions(); break;
      case "live_start": startLive(msg); break;
      case "live_stop": stopLive(); break;
      case "list_mics": send({ type: "mics", mics: await listMics() }); break;
      case "translation": applyGroqTranslation(msg.id, msg.ko); break;
    }
  };
}

// ───────────── 설치 모드: 번역 모델 받기 ─────────────
// 번역 모델의 첫 다운로드에는 사용자 클릭이 필요해 숨긴 엔진에서는 받을 수 없다.
// 앱이 이 페이지를 ?setup=translator 로 작은 창에 띄우면, 언어별 버튼을 눌러 받고 닫기로 숨김 모드로 돌아간다.
const SETUP_LANGS = [["en", "영어"], ["ja", "일본어"], ["zh", "중국어"]];

function showTranslatorSetup() {
  document.title = "Voice Keyboard — 번역 모델 받기";
  document.body.style.cssText = "margin:0;padding:20px;font:15px/1.5 system-ui,sans-serif;background:#fff;color:#111";
  document.body.innerHTML = `
    <h2 style="margin:0 0 8px;font-size:18px">번역 모델 받기</h2>
    <p style="margin:0 0 12px;color:#555">번역 자막(외국어 → 한국어)에 쓸 언어를 눌러 받으세요.
      Chrome 정책상 버튼 한 번에 한 언어씩 받습니다. 다 받았으면 닫기를 누르세요.</p>
    <div id="langs"></div>
    <button id="done" style="margin-top:14px;padding:8px 16px;font:inherit;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer">닫기</button>`;
  const box = document.getElementById("langs");
  for (const [code, name] of SETUP_LANGS) {
    const row = document.createElement("div");
    row.style.cssText = "display:flex;gap:10px;align-items:center;margin:6px 0";
    const btn = document.createElement("button");
    btn.textContent = `${name} → 한국어 받기`;
    btn.style.cssText = "padding:8px 14px;font:inherit;border-radius:8px;border:0;background:#2563eb;color:#fff;cursor:pointer;min-width:170px";
    const state = document.createElement("span");
    row.append(btn, state);
    box.append(row);
    const opts = { sourceLanguage: code, targetLanguage: "ko" };
    if ("Translator" in self) Translator.availability(opts).then((a) => {
      if (a === "available") { state.textContent = "받음"; btn.disabled = true; btn.style.background = "#9ca3af"; }
      else if (a === "unavailable") { state.textContent = "이 Chrome 에서 지원 안 함"; btn.disabled = true; btn.style.background = "#9ca3af"; }
    }).catch(() => {});
    btn.onclick = async () => {
      if (!("Translator" in self)) { state.textContent = "내장 번역 미지원 (Chrome 138 이상 필요)"; return; }
      btn.disabled = true;
      state.textContent = "준비 중…";
      try {
        const t = await Translator.create({ ...opts, monitor(m) {
          m.addEventListener("downloadprogress", (e) => { state.textContent = `${Math.round(e.loaded * 100)}%`; });
        } });
        t.destroy?.();
        state.textContent = "완료";
        btn.style.background = "#16a34a";
      } catch (err) {
        state.textContent = `실패: ${err.message}`;
        btn.disabled = false;
      }
    };
  }
  document.getElementById("done").onclick = async () => {
    await probeBuiltinTranslator();
    send({ type: "setup_done" });
  };
}

if (!Recognition) report("engine", "SpeechRecognition 없음 — 정식 Google Chrome 이 필요합니다");
if (new URLSearchParams(location.search).get("setup") === "translator") showTranslatorSetup();
connect();
probeBuiltinTranslator();
</script>
</body>
