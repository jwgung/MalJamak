<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현장 자막 교정</title>
<style>
  :root { --bg: #f7f7f8; --card: #fff; --fg: #111; --muted: #6b7280; --border: #e5e7eb; --accent: #2563eb;
          --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --pending: #fffbeb; --focus: #dbeafe; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111214; --card: #1b1c1f; --fg: #eee; --muted: #9ca3af; --border: #2c2d31;
            --pending: #2a2416; --focus: #172554; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg);
         display: flex; flex-direction: column; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--card);
           display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  button, select, input[type=number] { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border);
           background: transparent; color: inherit; font: inherit; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  select option { background: var(--card); }
  input[type=number] { width: 70px; }
  .grow { flex: 1; }
  .pill { font-size: 13px; color: var(--muted); }
  .pill.on { color: var(--bad); font-weight: 600; }
  #error { color: var(--bad); font-size: 13px; padding: 0 16px; }
  details { padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--card); }
  details .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 16px; margin-top: 8px; }
  details label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  details label select, details label input { color: var(--fg); }
  main { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .item { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; margin-bottom: 4px;
          border: 1px solid transparent; }
  .item.pending { background: var(--pending); border-color: var(--border); }
  .item.focused { outline: 2px solid var(--accent); background: var(--focus); }
  .item.sent .text { color: var(--muted); }
  .item.discarded { display: none; }
  .item .text { flex: 1; font-size: 17px; border: none; background: transparent; color: inherit; font: inherit;
                font-size: 17px; padding: 4px 6px; border-radius: 6px; min-width: 0; }
  .item .text:focus { outline: none; background: var(--card); }
  .item .meta { font-size: 12px; color: var(--muted); width: 54px; text-align: right; flex-shrink: 0; }
  .item .bar { width: 60px; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; flex-shrink: 0; }
  .item .bar i { display: block; height: 100%; background: var(--warn); }
  .item button { padding: 4px 10px; font-size: 13px; }
  #preview { padding: 10px 16px; border-top: 1px solid var(--border); background: var(--card); color: var(--muted);
             font-style: italic; min-height: 44px; }
  footer { padding: 6px 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }
  kbd { font-size: 11px; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<header>
  <h1>현장 자막</h1>
  <button id="btnLive" class="primary">자막 시작</button>
  <span id="state" class="pill">대기</span>
  <span class="grow"></span>
  <label class="pill">검토
    <select id="review">
      <option value="auto">자동 내보내기</option>
      <option value="manual">승인해야 내보내기</option>
    </select></label>
  <label class="pill">카운트다운 <input id="countdown" type="number" min="1" max="30" step="0.5">초</label>
  <button id="btnAll">대기 중 모두 내보내기</button>
  <button id="btnDisplay">자막 화면 열기</button>
</header>
<div id="error"></div>
<details>
  <summary>소리·화면 설정</summary>
  <div class="grid">
    <label>소리 입력 (믹서 출력·마이크)<select id="mic"><option value="">기본 마이크</option></select></label>
    <label>언어<select id="lang"><option value="ko-KR">한국어</option><option value="en-US">English</option><option value="ja-JP">日本語</option></select></label>
    <label>인식 방식<select id="engine"><option value="cloud">온라인 (정확)</option><option value="local">오프라인 (기기 내)</option></select></label>
    <label>통화용 보정 (잡음 제거·자동 음량)<select id="processing"><option value="false">끄기 — 믹서 직결</option><option value="true">켜기 — 공간 마이크</option></select></label>
    <label>조각 간격 (초)<input id="chunk" type="number" min="1" max="10" step="0.5"></label>
    <label>안정 판정 (초)<input id="stable" type="number" min="0.3" max="3" step="0.1"></label>
    <label>자막 글자 크기 (px)<input id="font" type="number" min="20" max="160" step="2"></label>
    <label>자막 줄 수<input id="lines" type="number" min="1" max="8"></label>
  </div>
  <p class="pill">소리 입력·언어·인식 방식·조각 설정은 자막을 다시 시작해야 적용됩니다.</p>
</details>
<main id="list"></main>
<div id="preview"></div>
<footer>
  <kbd>Enter</kbd> 내보내기(고친 내용 포함) · <kbd>Esc</kbd> 버리기 · <kbd>↑</kbd><kbd>↓</kbd> 이동 · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> 대기 중 모두 내보내기
  · 고치기 시작하면 카운트다운이 멈춥니다 · <span id="file"></span>
</footer>

<script>
const $ = (id) => document.getElementById(id);
let ws = null;
let status = {};
let items = [];
let receivedAt = performance.now();
let focusedId = null;
let stickToBottom = true;
const rows = new Map();  // id → { el, input, bar, meta }

function send(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws?role=operator`);
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type !== "queue") return;
    items = msg.items; status = msg.status; receivedAt = performance.now();
    $("preview").textContent = msg.preview ? `말하는 중: ${msg.preview}` : "";
    render();
  };
  ws.onclose = () => { $("state").textContent = "연결 끊김, 재연결 중…"; setTimeout(connect, 1000); };
}

function renderHeader() {
  $("btnLive").textContent = status.live ? "자막 정지" : "자막 시작";
  $("btnLive").className = status.live ? "danger" : "primary";
  $("state").textContent = status.live ? "● 인식 중" : status.engine ? "대기" : "엔진 준비 중…";
  $("state").className = status.live ? "pill on" : "pill";
  if (document.activeElement !== $("review")) $("review").value = status.review;
  if (document.activeElement !== $("countdown")) $("countdown").value = status.countdown;
  $("error").textContent = status.last_error || "";
  $("file").textContent = status.transcript ? `기록: ${status.transcript}` : "";
}

function makeRow(item) {
  const el = document.createElement("div");
  el.className = "item";
  el.dataset.id = item.id;
  const input = document.createElement("input");
  input.className = "text";
  input.value = item.text;
  const bar = document.createElement("span");
  bar.className = "bar"; bar.innerHTML = "<i></i>";
  const meta = document.createElement("span");
  meta.className = "meta";
  const sendBtn = document.createElement("button");
  sendBtn.textContent = "내보내기";
  const dropBtn = document.createElement("button");
  dropBtn.textContent = "버리기";
  el.append(input, bar, meta, sendBtn, dropBtn);

  let editing = false;
  input.addEventListener("focus", () => setFocus(item.id, false));
  input.addEventListener("input", () => {
    if (!editing) { editing = true; send({ cmd: "editing", id: item.id, on: true }); }
  });
  input.addEventListener("blur", () => {
    if (editing) { editing = false; send({ cmd: "update", id: item.id, text: input.value }); }
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendAll(); return; }
    if (e.key === "Enter") { e.preventDefault(); editing = false; send({ cmd: "send", id: item.id, text: input.value }); moveFocus(1, true); }
    else if (e.key === "Escape") { e.preventDefault(); editing = false; send({ cmd: "discard", id: item.id }); moveFocus(1, true); }
    else if (e.key === "ArrowDown") { e.preventDefault(); moveFocus(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); moveFocus(-1); }
  });
  sendBtn.onclick = () => { editing = false; send({ cmd: "send", id: item.id, text: input.value }); };
  dropBtn.onclick = () => { editing = false; send({ cmd: "discard", id: item.id }); };
  const row = { el, input, bar: bar.firstChild, meta, isEditing: () => editing };
  rows.set(item.id, row);
  return row;
}

function render() {
  renderHeader();
  const list = $("list");
  stickToBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 60;
  const seen = new Set();
  for (const item of items) {
    seen.add(item.id);
    const row = rows.get(item.id) || makeRow(item);
    if (!row.el.isConnected) list.append(row.el);
    row.el.classList.toggle("pending", item.status === "pending");
    row.el.classList.toggle("sent", item.status === "sent");
    row.el.classList.toggle("discarded", item.status === "discarded");
    // 조작자가 고치고 있는 칸은 덮어쓰지 않는다.
    if (!row.isEditing() && document.activeElement !== row.input) row.input.value = item.text;
    row.item = item;
    row.meta.textContent = item.status === "sent" ? (item.edited ? "고침·나감" : "나감")
                         : item.status === "pending" ? (item.editing ? "고치는 중" : item.remaining == null ? "대기" : "") : "";
    row.bar.parentElement.style.visibility = item.status === "pending" && item.remaining != null && !item.editing ? "visible" : "hidden";
  }
  for (const [id, row] of rows) if (!seen.has(id)) { row.el.remove(); rows.delete(id); }
  // 포커스 관리: 설정 칸 등 다른 곳을 만지는 중이면 건드리지 않는다.
  const active = document.activeElement;
  const nothingFocused = !active || active === document.body;
  const focusedRow = rows.get(focusedId);
  const focusedGone = focusedRow && focusedRow.item.status !== "pending" && !focusedRow.isEditing()
                      && active === focusedRow.input;  // 보던 조각이 자동으로 나갔으면 다음 대기 조각으로
  if (nothingFocused || focusedGone) {
    const first = items.find((i) => i.status === "pending");
    if (first) setFocus(first.id, true);
  }
  if (stickToBottom) list.scrollTop = list.scrollHeight;
}

function setFocus(id, takeFocus) {
  focusedId = id;
  for (const [rid, row] of rows) row.el.classList.toggle("focused", rid === id);
  const row = rows.get(id);
  if (takeFocus && row && document.activeElement !== row.input) row.input.focus({ preventScroll: true });
}

function visibleIds() { return items.filter((i) => i.status !== "discarded").map((i) => i.id); }

function moveFocus(delta, preferPending = false) {
  const ids = visibleIds();
  let idx = ids.indexOf(focusedId);
  if (preferPending) {
    const next = items.find((i) => i.status === "pending" && i.id !== focusedId && ids.indexOf(i.id) > idx);
    if (next) { setFocus(next.id, true); return; }
  }
  idx = Math.max(0, Math.min(ids.length - 1, idx + delta));
  if (ids[idx] != null) setFocus(ids[idx], true);
}

function sendAll() { send({ cmd: "send_all" }); }

// 카운트다운 막대는 서버가 준 남은 시간을 기준으로 화면에서 줄인다.
function tick() {
  const elapsed = (performance.now() - receivedAt) / 1000;
  const total = Number(status.countdown) || 3;
  for (const row of rows.values()) {
    const item = row.item;
    if (!item || item.status !== "pending" || item.remaining == null || item.editing) continue;
    const left = Math.max(0, item.remaining - elapsed);
    row.bar.style.width = `${(left / total) * 100}%`;
    row.meta.textContent = `${left.toFixed(1)}초`;
  }
  requestAnimationFrame(tick);
}

// ───────── 설정 ─────────

async function loadSettings() {
  const { settings } = await (await fetch("/api/settings")).json();
  const l = settings.live;
  $("lang").value = l.lang; $("engine").value = l.engine; $("processing").value = String(l.voice_processing);
  $("chunk").value = l.chunk_seconds; $("stable").value = l.stable_seconds; $("font").value = l.font_size; $("lines").value = l.lines;
  try {
    const { mics } = await (await fetch("/api/sources")).json();
    mics.filter((m) => m.id !== "default" && m.id !== "communications")
        .forEach((m, i) => $("mic").add(new Option(m.label || `입력 장치 ${i + 1}`, m.id)));
  } catch (_) {}
  $("mic").value = l.mic;
}

async function save(patch) {
  await fetch("/api/settings", { method: "POST", headers: { "Content-Type": "application/json" },
                                 body: JSON.stringify({ live: patch }) });
}

$("review").onchange = () => save({ review: $("review").value });
$("countdown").onchange = () => save({ countdown: Number($("countdown").value) });
$("mic").onchange = () => save({ mic: $("mic").value });
$("lang").onchange = () => save({ lang: $("lang").value });
$("engine").onchange = () => save({ engine: $("engine").value });
$("processing").onchange = () => save({ voice_processing: $("processing").value === "true" });
$("chunk").onchange = () => save({ chunk_seconds: Number($("chunk").value) });
$("stable").onchange = () => save({ stable_seconds: Number($("stable").value) });
$("font").onchange = () => save({ font_size: Number($("font").value) });
$("lines").onchange = () => save({ lines: Number($("lines").value) });

$("btnLive").onclick = () => send({ cmd: status.live ? "stop" : "start" });
$("btnAll").onclick = sendAll;
$("btnDisplay").onclick = () => fetch("/live/display-window", { method: "POST" });
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && !e.target.classList?.contains("text")) { e.preventDefault(); sendAll(); }
});

loadSettings();
connect();
requestAnimationFrame(tick);
</script>
</body>
</html>
